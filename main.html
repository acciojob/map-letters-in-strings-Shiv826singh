<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map Letters in a String</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="container">
        <h1>Map Letters in a String</h1>

        <div class="input-section">
            <input
                type="text"
                id="wordInput"
                placeholder="Enter a word"
            >

            <button id="mapButton">Map Letters</button>
        </div>

        <div class="result">
            <h2>Result</h2>
            <pre id="output">{}</pre>
        </div>
    </div>

    <script src="./script.js"></script>

</body>
</html>
